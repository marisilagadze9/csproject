<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px 50px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            text-align: center;
            width: 350px;
        }
        h2 {
            margin-bottom: 25px;
            color: #333;
        }
        a {
            display: block;
            margin: 12px 0;
            background-color: #4facfe;
            color: white;
            padding: 10px 0;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        a:hover {
            background-color: #00c6ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Welcome to the Login System</h2>
        <a href="/register">Register</a>
        <a href="/login">Login</a>
        <a href="/admin">Admin</a>
    </div>
</body>
</html>
